
name: Compilar EXE Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Python de compilação
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Compilar aplicação autónoma
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name Localizador_Ficheiros_Duplicados
          --collect-all PIL --collect-all send2trash
          --hidden-import PIL.ImageTk
          --icon=localizador_clf.ico
          --add-data "localizador_clf.ico;."
          localizador_duplicados.py

      - name: Criar pacote ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/Localizador_Ficheiros_Duplicados" -DestinationPath "Localizador_Ficheiros_Duplicados_Windows11_v1_5.zip" -Force

      - name: Disponibilizar pacote compilado
        uses: actions/upload-artifact@v4
        with:
          name: Localizador_Ficheiros_Duplicados_Windows11_v1_5
          path: Localizador_Ficheiros_Duplicados_Windows11_v1_5.zip
          if-no-files-found: error
          retention-days: 30
